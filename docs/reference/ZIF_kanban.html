<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIF — Канбан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0A0A;--abyss:#111111;--obsidian:#1A1714;--shadow:#2A2520;--stone:#3D362E;
  --bronze:#5C4F3C;--agold:#8B7441;--gold:#C9A84C;--bgold:#E2C45E;--holy:#F5E6A3;
  --blood:#8B2020;--ember:#C44B2F;--ice:#5B8FA8;--poison:#4A7A3D;--crystal:#6B5BA8;
  --text:#E8DFC8;--muted:#9A8C72;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
header{padding:20px 20px 12px;border-bottom:1px solid var(--shadow);background:linear-gradient(180deg,#14110d,var(--void))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between}
h1{font-family:"Cormorant SC",serif;color:var(--gold);margin:0;font-size:26px;letter-spacing:.08em}
h1 small{display:block;font:500 12px Inter,sans-serif;color:var(--muted);letter-spacing:0;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--obsidian);border:1px solid var(--stone);border-radius:6px;padding:7px 10px}
button{cursor:pointer}
button:hover{border-color:var(--gold);color:var(--bgold)}
button.primary{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:600}
button.primary:hover{background:var(--bgold);color:#1a1408}
.ms-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.ms{flex:1 1 180px;background:var(--abyss);border:1px solid var(--shadow);border-radius:8px;padding:8px 10px}
.ms b{font-size:12px;color:var(--gold)}
.ms span{float:right;font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--shadow);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.filters input{flex:1 1 200px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--stone);background:transparent;color:var(--muted);cursor:pointer}
.chip.on{background:var(--shadow);color:var(--holy);border-color:var(--agold)}
main{display:flex;gap:12px;padding:16px;overflow-x:auto;align-items:flex-start;min-height:calc(100vh - 250px)}
.col{flex:1 0 260px;background:var(--abyss);border:1px solid var(--shadow);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.col h2{margin:0;padding:12px 14px;font:700 16px "Cormorant SC",serif;letter-spacing:.06em;color:var(--gold);border-bottom:1px solid var(--shadow);display:flex;justify-content:space-between}
.col h2 em{font:500 12px Inter;color:var(--muted);font-style:normal}
.list{padding:10px;overflow-y:auto;flex:1;min-height:80px}
.list.over{background:#16130f;outline:1px dashed var(--agold);outline-offset:-6px}
.card{background:var(--obsidian);border:1px solid var(--shadow);border-left:3px solid var(--c,var(--agold));border-radius:7px;padding:9px 10px;margin-bottom:8px;cursor:grab}
.card:hover{border-color:var(--stone);border-left-color:var(--c,var(--agold))}
.card.drag{opacity:.4}
.card .t{font-weight:600;font-size:13px;color:var(--text)}
.card .d{font-size:12px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--shadow);color:var(--muted);white-space:nowrap}
.tag.ms1{color:#1a1408;background:var(--gold)}
.tag.ms2{color:var(--holy);background:#4d3f22}
.tag.ms3{color:var(--text);background:var(--stone)}
.tag.ms4{color:var(--muted);background:#221e19}
.tag.who{color:var(--holy);background:#2b2216;border:1px solid var(--bronze)}
.col[data-s=done] .card{opacity:.65}
.col[data-s=done] .card .t{text-decoration:line-through;text-decoration-color:var(--bronze)}
.empty{color:var(--bronze);font-size:12px;text-align:center;padding:16px 0}
dialog{background:var(--abyss);color:var(--text);border:1px solid var(--agold);border-radius:12px;padding:0;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dlg{padding:18px;display:grid;gap:10px}
.dlg h3{margin:0;font-family:"Cormorant SC",serif;color:var(--gold)}
.dlg label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg textarea{min-height:110px;resize:vertical}
.dlg .row{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
.danger{border-color:var(--blood);color:#e38b8b}
.danger:hover{border-color:var(--ember);color:#ffb0a0}
.legend{font-size:12px;color:var(--muted);padding:0 16px 20px}
@media (max-width:600px){
  header{padding:16px}
  main{padding:12px 16px}
  .col{flex-basis:84vw}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>ZIF<small>Канбан по дизайн-документу v1.00 · Roguelike-арканоид про Сизифа</small></h1>
    <div class="actions">
      <button class="primary" id="addBtn">+ Задача</button>
      <button id="expBtn">Экспорт JSON</button>
      <button id="impBtn">Импорт</button>
      <button id="resetBtn" class="danger">Сброс</button>
      <input type="file" id="impFile" accept=".json" hidden>
    </div>
  </div>
  <div class="ms-row" id="msRow"></div>
  <div class="filters">
    <input id="q" placeholder="Поиск по задачам…">
    <select id="fMs"><option value="">Все вехи</option></select>
    <select id="fType"><option value="">Все типы</option></select>
    <select id="fWho"><option value="">Все исполнители</option></select>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="board"></main>
<div class="legend">Перетаскивай карточки между колонками. Клик по карточке — редактирование. Изменения сохраняются в этом браузере; для передачи SERGO — «Экспорт JSON» → «Импорт».</div>

<dialog id="dlg">
  <form class="dlg" method="dialog" id="form">
    <h3 id="dlgTitle">Задача</h3>
    <label>Название<input name="title" required></label>
    <label>Описание<textarea name="desc"></textarea></label>
    <div class="grid2">
      <label>Эпик<select name="epic"></select></label>
      <label>Веха<select name="ms"></select></label>
      <label>Тип<select name="type"></select></label>
      <label>Исполнитель<select name="who"></select></label>
      <label>Статус<select name="status"></select></label>
    </div>
    <div class="row">
      <button type="button" class="danger" id="delBtn">Удалить</button>
      <span style="display:flex;gap:8px">
        <button type="button" id="cancelBtn">Отмена</button>
        <button class="primary" value="save">Сохранить</button>
      </span>
    </div>
  </form>
</dialog>

<script>
const COLS=[["backlog","Бэклог"],["todo","К работе"],["doing","В работе"],["review","Проверка"],["done","Готово"]];
const MS={1:"M1 · Вертикальный срез",2:"M2 · Альфа",3:"M3 · Бета",4:"M4 · Релиз"};
const MS_HINT={1:"Пустыня целиком: бросок, враги, предметы, магазин, босс Ламия",2:"Биомы 1–3, хаб, мета-прогрессия, сохранения",3:"Все биомы, Арес, сюжет, баланс",4:"Полировка, локализация, эндгейм"};
const TYPES=["Код","Геймдизайн","Арт","Звук","Нарратив","UI","Продакшн"];
const WHO=["—","Богдан","SERGO"];
const EPICS={
 core:["Валун и бросок","#C9A84C"],

const KEY="zif-kanban-v1";
let tasks=[];
function seed(){return SEED.map((r,i)=>({id:"t"+(i+1),status:r[0],epic:r[1],ms:r[2],type:r[3],title:r[4],desc:r[5],who:"—"}))}
function load(){try{const s=localStorage.getItem(KEY);if(s){tasks=JSON.parse(s);return}}catch(e){}tasks=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
const st={q:"",ms:"",type:"",who:"",epics:new Set()};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fill(sel,arr,first){sel.innerHTML=(first?`<option value="">${first}</option>`:"")+arr.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("")}
fill($("#fMs"),Object.entries(MS),"Все вехи");
fill($("#fType"),TYPES.map(t=>[t,t]),"Все типы");
fill($("#fWho"),WHO.map(w=>[w,w==="—"?"Не назначено":w]),"Все исполнители");
const f=$("#form");
fill(f.epic,Object.entries(EPICS).map(([k,v])=>[k,v[0]]));
fill(f.ms,Object.entries(MS));
fill(f.type,TYPES.map(t=>[t,t]));
fill(f.who,WHO.map(w=>[w,w]));
fill(f.status,COLS);

function chips(){
  $("#chips").innerHTML=Object.entries(EPICS).map(([k,[n,c]])=>`<button class="chip ${st.epics.has(k)?"on":""}" data-e="${k}" style="border-left:3px solid ${c}">${n}</button>`).join("");
}
$("#chips").onclick=e=>{const k=e.target.dataset.e;if(!k)return;st.epics.has(k)?st.epics.delete(k):st.epics.add(k);render()};

function pass(t){
  if(st.ms&&String(t.ms)!==st.ms)return false;
  if(st.type&&t.type!==st.type)return false;
  if(st.who&&t.who!==st.who)return false;
  if(st.epics.size&&!st.epics.has(t.epic))return false;
  if(st.q){const q=st.q.toLowerCase();if(!(t.title+" "+t.desc).toLowerCase().includes(q))return false}
  return true;
}

function render(){
  chips();
  $("#msRow").innerHTML=Object.entries(MS).map(([k,n])=>{
    const all=tasks.filter(t=>String(t.ms)===k),d=all.filter(t=>t.status==="done").length,p=all.length?Math.round(d/all.length*100):0;
    return `<div class="ms" title="${esc(MS_HINT[k])}"><b>${n}</b><span>${d}/${all.length}</span><div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(MS_HINT[k])}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("");
  $("#board").innerHTML=COLS.map(([s,n])=>{
    const list=tasks.filter(t=>t.status===s&&pass(t));
    return `<section class="col" data-s="${s}"><h2>${n}<em>${list.length}</em></h2><div class="list" data-s="${s}">${
      list.length?list.map(card).join(""):'<div class="empty">Пусто</div>'}</div></section>`}).join("");
}
function card(t){
  const [en,ec]=EPICS[t.epic]||["—","#8B7441"];
  return `<div class="card" draggable="true" data-id="${t.id}" style="--c:${ec}">
    <div class="t">${esc(t.title)}</div>${t.desc?`<div class="d">${esc(t.desc)}</div>`:""}
    <div class="meta"><span class="tag ms${t.ms}">M${t.ms}</span><span class="tag">${esc(en)}</span><span class="tag">${esc(t.type)}</span>${t.who&&t.who!=="—"?`<span class="tag who">${esc(t.who)}</span>`:""}</div></div>`;
}

// drag & drop
let dragId=null;
$("#board").addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c)return;dragId=c.dataset.id;c.classList.add("drag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
$("#board").addEventListener("dragend",e=>{const c=e.target.closest(".card");if(c)c.classList.remove("drag");document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))});
$("#board").addEventListener("dragover",e=>{const l=e.target.closest(".list");if(!l)return;e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==l&&x.classList.remove("over"));l.classList.add("over")});
$("#board").addEventListener("drop",e=>{const l=e.target.closest(".list");if(!l||!dragId)return;e.preventDefault();
  const t=tasks.find(x=>x.id===dragId);const target=e.target.closest(".card");
  t.status=l.dataset.s;
  tasks=tasks.filter(x=>x!==t);
  if(target&&target.dataset.id!==t.id){const i=tasks.findIndex(x=>x.id===target.dataset.id);tasks.splice(i,0,t)}else tasks.push(t);
  dragId=null;save();render()});

// edit
let editing=null;
function openDlg(t){
  editing=t;$("#dlgTitle").textContent=t?"Задача":"Новая задача";
  const v=t||{title:"",desc:"",epic:"core",ms:1,type:"Код",who:"—",status:"backlog"};
  for(const k of ["title","desc","epic","ms","type","who","status"])f[k].value=v[k];
  $("#delBtn").style.visibility=t?"visible":"hidden";$("#dlg").showModal();
}
$("#board").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openDlg(tasks.find(x=>x.id===c.dataset.id))});
$("#addBtn").onclick=()=>openDlg(null);
$("#cancelBtn").onclick=()=>$("#dlg").close();
f.addEventListener("submit",()=>{
  const v={title:f.title.value.trim(),desc:f.desc.value.trim(),epic:f.epic.value,ms:+f.ms.value,type:f.type.value,who:f.who.value,status:f.status.value};
  if(!v.title)return;
  if(editing)Object.assign(editing,v);else tasks.push({id:"t"+Date.now(),...v});
  save();render();
});
$("#delBtn").onclick=()=>{if(editing){tasks=tasks.filter(x=>x!==editing);save();render()}$("#dlg").close()};

// filters
$("#q").oninput=e=>{st.q=e.target.value;render()};
$("#fMs").onchange=e=>{st.ms=e.target.value;render()};
$("#fType").onchange=e=>{st.type=e.target.value;render()};
$("#fWho").onchange=e=>{st.who=e.target.value;render()};

// io
$("#expBtn").onclick=()=>{const b=new Blob([JSON.stringify(tasks,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="zif_kanban.json";a.click();URL.revokeObjectURL(a.href)};
$("#impBtn").onclick=()=>$("#impFile").click();
$("#impFile").onchange=e=>{const fl=e.target.files[0];if(!fl)return;fl.text().then(s=>{try{const d=JSON.parse(s);if(Array.isArray(d)){tasks=d;save();render()}}catch(_){}});e.target.value=""};
$("#resetBtn").onclick=()=>{const b=$("#resetBtn");if(b.dataset.arm){tasks=seed();save();render();b.textContent="Сброс";delete b.dataset.arm}else{b.dataset.arm=1;b.textContent="Точно сбросить?";setTimeout(()=>{b.textContent="Сброс";delete b.dataset.arm},3000)}};

load();render();
</script>
