services:
  # База на этом же сервере. Для внешней базы уберите localdb из COMPOSE_PROFILES в .env
  # и укажите её адрес в KANBANLY_DATABASE_URL.
  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: kanbanly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanbanly}
      POSTGRES_DB: kanbanly
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbanly"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Только для разработки: письма со ссылками сброса пароля читаемы всем, кто видит порт.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
        # С внешней базой сервиса db нет, и api стартует без него.
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KANBANLY_WEB_PORT:-8080}:8080"

volumes:
  db-data:
