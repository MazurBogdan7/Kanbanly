# Блок для nginx, который уже стоит на сервере и обслуживает другие сайты.
# 1. Замените kanban.example.com на свой домен и 8090 на KANBANLY_WEB_PORT из .env.
#    Своего домена пока нет — подойдёт kanban.<IP-через-дефисы>.sslip.io, например
#    kanban.203-0-113-7.sslip.io: такое имя само указывает на IP, и certbot выдаст сертификат.
# 2. cp deploy/nginx-kanbanly.conf /etc/nginx/sites-available/kanbanly
#    ln -s /etc/nginx/sites-available/kanbanly /etc/nginx/sites-enabled/kanbanly
#    nginx -t && systemctl reload nginx
# 3. HTTPS: certbot --nginx -d kanban.example.com (certbot сам допишет блок на 443).
server {
    listen 80;
    listen [::]:80;
    server_name kanban.example.com;

    # Бэкапы и документы проекта бывают большими.
    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
