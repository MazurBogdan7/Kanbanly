[project]
name = "kanbanly-backend"
version = "0.1.0"
description = "Kanbanly — конструктор канбан-досок (API)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43",
  "aiosmtplib>=3.0",
  "mammoth>=1.13.0",
  "openpyxl>=3.1.5",
  "nh3>=0.3.7",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "hypothesis>=6.110",
  "jsonschema>=4.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "pgserver>=0.1.4",
  "psycopg2-binary>=2.9",
  "pre-commit>=3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: требует настоящий PostgreSQL"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "RUF012", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S105", "S106", "S108", "S311", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app"]
